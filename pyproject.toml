[project]
name = "world-weather-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lightgbm>=4.6.0",
    "lxml>=5.0.0",
    "requests>=2.32.0",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "plotly>=6.7.0",
    "polars>=1.38.1",
    "pyarrow>=23.0.1",
    # lightgbm.sklearn (LGBMRegressor) が scikit-learn を必須とするため明示的に宣言する
    "scikit-learn>=1.8.0",
    "tqdm>=4.67.3",
    "dash>=4.4.1",
    "dash-html-components>=2.0.0",
    "plotly-express>=0.4.1",
]

[tool.ruff]
extend-exclude = [".venv_broken_*", "pytest-cache-files-*", ".tmp_unit", ".tmp_integration"]

[tool.mypy]
exclude = ["^\\.venv_broken_", "^pytest-cache-files-", "^\\.tmp_"]

# 型スタブを提供しないライブラリ群。スタブを入れると既存コード全体に
# 大量の型エラーが波及するため、インポート側だけ緩める
[[tool.mypy.overrides]]
module = [
    "pandas",
    "pandas.*",
    "plotly",
    "plotly.*",
    "tqdm",
    "tqdm.*",
    "lightgbm",
    "lightgbm.*",
]
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["forecast_core*", "app_platform*"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.1",
    "types-requests>=2.32.0",
]
